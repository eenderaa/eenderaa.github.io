<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --hero1:#0b1020;
  --hero2:#1b0000;
  --accent:#e50914;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:900;
  color:var(--accent);
}

header input{
  flex:1;
  padding:10px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
}

header button{
  border:0;
  padding:10px 14px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

/* ROWS */
.row{
  padding:10px 20px;
}

.scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.card{
  min-width:140px;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  position:relative;
}

.card:hover{transform:scale(1.08);}

.card img{
  width:140px;
  height:210px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:8px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  opacity:0;
}

.card:hover .overlay{opacity:1;}

/* PLAYER */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(1100px,95vw);
}

iframe{
  width:100%;
  height:70vh;
  border:0;
  border-radius:14px;
}

.top{
  display:flex;
  justify-content:space-between;
}

.close{
  background:var(--accent);
  border:0;
  padding:10px 14px;
  border-radius:10px;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.popup-box{
  background:#111827;
  padding:20px;
  border-radius:16px;
  width:320px;
  text-align:center;
}

.popup-box button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- START POPUP -->
<div class="popup" id="startupPopup">
  <div class="popup-box">

    <h2>🎬 Featured Picks</h2>

    <p>Movie: Coraline</p>
    <button onclick="openFeatured('Coraline','movie')">
      Watch Movie
    </button>

    <p>Show: SK8 the Infinity</p>
    <button onclick="openFeatured('SK8 the Infinity','tv')">
      Watch Show
    </button>

    <button onclick="closePopup()" style="background:#333">
      Close
    </button>

  </div>
</div>

<header>
  <div class="logo">ENDERA</div>
  <input id="searchInput" placeholder="Search..."/>
  <button onclick="search()">Search</button>
</header>

<!-- CONTINUE WATCHING -->
<div class="row">
  <h2>Continue Watching</h2>
  <div class="scroll" id="continueRow"></div>
</div>

<div class="row">
  <h2>Trending Movies</h2>
  <div class="scroll" id="movies"></div>
</div>

<div class="row">
  <h2>Trending TV</h2>
  <div class="scroll" id="tv"></div>
</div>

<div class="row">
  <h2>Search</h2>
  <div class="scroll" id="results"></div>
</div>

<!-- PLAYER -->
<div class="modal" id="playerModal">
  <div class="box">

    <div class="top">
      <h2 id="title"></h2>
      <button class="close" onclick="closePlayer()">X</button>
    </div>

    <iframe id="player"></iframe>

  </div>
</div>

<script>

const TMDB_KEY="c926a0628b472f4bde70b9457ed62bc3";

let currentId="";
let currentType="movie";

/* POPUP */
function closePopup(){
  document.getElementById("startupPopup").style.display="none";
}

async function openFeatured(name,type){

  const res=await fetch(
    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}`
  );

  const data=await res.json();

  const item=data.results?.[0];

  if(item){
    openPlayer(item.id,type,name);
  }

  closePopup();
}

/* CONTINUE WATCHING */
function saveContinue(id,type,title){

  let list=JSON.parse(localStorage.getItem("cw")||"[]");

  list=list.filter(i=>i.id!==id);

  list.unshift({id,type,title});

  list=list.slice(0,10);

  localStorage.setItem("cw",JSON.stringify(list));

  renderContinue();
}

function renderContinue(){

  const box=document.getElementById("continueRow");

  let list=JSON.parse(localStorage.getItem("cw")||"[]");

  box.innerHTML="";

  list.forEach(i=>{

    box.innerHTML+=`
      <div class="card"
        onclick="openPlayer('${i.id}','${i.type}','${i.title}')">

        <img src="https://placehold.co/140x210">
        <div class="overlay"><span>${i.title}</span></div>

      </div>
    `;
  });
}

/* SEARCH */
async function search(){

  const q=document.getElementById("searchInput").value;

  const res=await fetch(
    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${q}`
  );

  const data=await res.json();

  const box=document.getElementById("results");
  box.innerHTML="";

  (data.results||[])
  .filter(i=>i.media_type==="movie"||i.media_type==="tv")
  .forEach(i=>{

    const title=i.title||i.name;

    const type=i.media_type==="tv"?"tv":"movie";

    box.innerHTML+=`
      <div class="card"
        onclick="openPlayer('${i.id}','${type}','${title.replace(/'/g,"\\'")}')">

        <img src="https://image.tmdb.org/t/p/w300${i.poster_path}">
        <div class="overlay"><span>${title}</span></div>

      </div>
    `;
  });
}

/* PLAYER */
function openPlayer(id,type,title){

  currentId=id;
  currentType=type;

  document.getElementById("title").textContent=title;

  document.getElementById("playerModal").style.display="flex";

  loadPlayer();

  saveContinue(id,type,title);
}

function loadPlayer(){

  let url="";

  if(currentType==="tv"){

    url=`https://vidfast.pro/tv/${currentId}/1/1?autoPlay=true`;

  }else{

    url=`https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  const iframe=document.getElementById("player");

  iframe.src="about:blank";

  setTimeout(()=>iframe.src=url,100);
}

function closePlayer(){
  document.getElementById("playerModal").style.display="none";
  document.getElementById("player").src="about:blank";
}

/* INIT */
renderContinue();
setTimeout(()=>loadTrending(),500);
document.getElementById("startupPopup").style.display="flex";

</script>

</body>
</html>
