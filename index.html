<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --bg1:#0b1020;
  --bg2:#1b0000;
  --accent:#e50914;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  z-index:999;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--accent);
}

header input{
  flex:1;
  padding:12px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
  outline:none;
}

header button{
  border:0;
  padding:12px 16px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.settings{
  position:fixed;
  top:70px;
  right:20px;
  width:220px;
  background:#111827;
  border-radius:16px;
  padding:14px;
  display:none;
  z-index:9999;
}

.settings button{
  width:100%;
  margin-top:8px;
}

.row{
  padding:18px 20px;
}

.row h2{margin-bottom:10px;}

.scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

.scroll::-webkit-scrollbar{display:none;}

.card{
  min-width:150px;
  width:150px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.2s;
  background:#111;
}

.card:hover{transform:scale(1.08);}

.card img{
  width:100%;
  height:225px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.95),transparent);
  opacity:0;
  transition:.2s;
}

.card:hover .overlay{opacity:1;}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

.player-box{
  width:min(1200px,95vw);
}

iframe{
  width:100%;
  height:75vh;
  border:0;
  border-radius:14px;
  background:black;
}

.tv-controls{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv-controls input{
  width:100px;
  padding:10px;
  border-radius:10px;
  border:0;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
}

.popup-box{
  width:320px;
  background:#111827;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.popup-box button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:10px;
}

.primary{background:var(--accent);color:white;}
.secondary{background:#333;color:white;}

</style>
</head>

<body>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2>Featured Picks</h2>

    <p>Coraline</p>
    <button class="primary" onclick="featured('Coraline','movie')">Watch</button>

    <p>SK8 the Infinity</p>
    <button class="primary" onclick="featured('SK8 the Infinity','tv')">Watch</button>

    <button class="secondary" onclick="dontShowAgain()">Don't show again</button>
    <button class="secondary" onclick="closePopup()">Close</button>
  </div>
</div>

<div class="settings" id="settings">
  <button onclick="theme('red')">Red</button>
  <button onclick="theme('blue')">Blue</button>
</div>

<header>
  <div class="logo">ENDERA</div>

  <input id="searchInput" placeholder="Search..." />
  <button onclick="searchMedia()">Search</button>
  <button onclick="toggleSettings()">⚙️</button>
</header>

<div class="row">
  <h2>Continue Watching</h2>
  <div class="scroll" id="continueRow"></div>
</div>

<div class="row">
  <h2>Trending Movies</h2>
  <div class="scroll" id="movies"></div>
</div>

<div class="row">
  <h2>Trending Shows</h2>
  <div class="scroll" id="tv"></div>
</div>

<div class="row">
  <h2>Action</h2>
  <div class="scroll" id="actionRow"></div>
</div>

<div class="row">
  <h2>Comedy</h2>
  <div class="scroll" id="comedyRow"></div>
</div>

<div class="row">
  <h2>Horror</h2>
  <div class="scroll" id="horrorRow"></div>
</div>

<div class="row">
  <h2>Recommended For You</h2>
  <div class="scroll" id="recommendRow"></div>
</div>

<div class="modal" id="playerModal">
  <div class="player-box">

    <h2 id="playerTitle"></h2>

    <div class="tv-controls" id="tvControls">
      <input id="season" type="number" value="1"/>
      <input id="episode" type="number" value="1"/>
      <button onclick="loadPlayer()">Load</button>
    </div>

    <iframe id="player"
      allow="autoplay; fullscreen; encrypted-media"
      referrerpolicy="no-referrer">
    </iframe>

  </div>
</div>

<script>

const TMDB_KEY = "c926a0628b472f4bde70b9457ed62bc3";

let currentId="";
let currentType="movie";

function toggleSettings(){
  const s=document.getElementById("settings");
  s.style.display = s.style.display==="block"?"none":"block";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}
function dontShowAgain(){
  localStorage.setItem("hidePopup","true");
  closePopup();
}

async function featured(name,type){
  const res=await fetch(
    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}`
  );
  const data=await res.json();
  const item=data.results?.[0];
  if(!item)return;

  openPlayer(item.id,type,item.title||item.name,"");
  closePopup();
}

function saveContinue(id,type,title,poster){
  let list=JSON.parse(localStorage.getItem("cw")||"[]");
  list=list.filter(i=>i.id!==id);
  list.unshift({id,type,title,poster});
  localStorage.setItem("cw",JSON.stringify(list.slice(0,10)));
  renderContinue();
}

function renderContinue(){
  const box=document.getElementById("continueRow");
  const list=JSON.parse(localStorage.getItem("cw")||"[]");
  box.innerHTML="";
  list.forEach(i=>{
    box.innerHTML+=`
      <div class="card" onclick="openPlayer('${i.id}','${i.type}','${i.title}','${i.poster}')">
        <img src="${i.poster}">
        <div class="overlay"><span>${i.title}</span></div>
      </div>`;
  });
}

function render(id,data,type){
  const box=document.getElementById(id);
  box.innerHTML="";
  data.forEach(i=>{
    const title=i.title||i.name;
    const poster=`https://image.tmdb.org/t/p/w300${i.poster_path}`;
    box.innerHTML+=`
      <div class="card" onclick="openPlayer('${i.id}','${type}','${title}','${poster}')">
        <img src="${poster}">
        <div class="overlay"><span>${title}</span></div>
      </div>`;
  });
}

async function loadTrending(){
  const m=await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`).then(r=>r.json());
  const t=await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`).then(r=>r.json());

  render("movies",m.results||[],"movie");
  render("tv",t.results||[],"tv");
}

async function loadGenres(){
  const load=async(id,row)=>{
    const r=await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=${id}`).then(r=>r.json());
    render(row,r.results||[],"movie");
  };

  load(28,"actionRow");
  load(35,"comedyRow");
  load(27,"horrorRow");
}

async function loadRecommendations(id,type){
  const r=await fetch(`https://api.themoviedb.org/3/${type}/${id}/recommendations?api_key=${TMDB_KEY}`).then(r=>r.json());
  render("recommendRow",r.results||[],type);
}

async function searchMedia(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q)return;

  const r=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`).then(r=>r.json());

  render("movies",r.results.filter(i=>i.media_type==="movie"),"movie");
  render("tv",r.results.filter(i=>i.media_type==="tv"),"tv");
}

function openPlayer(id,type,title,poster){
  currentId=id;
  currentType=type==="tv"?"tv":"movie";

  document.getElementById("playerTitle").textContent=title;
  document.getElementById("playerModal").style.display="flex";

  document.getElementById("tvControls").style.display=
    currentType==="tv"?"flex":"none";

  loadPlayer();
  loadRecommendations(id,currentType);

  saveContinue(id,type,title,poster);
}

function loadPlayer(){
  let url="";

  if(currentType==="tv"){
    const s=season.value||1;
    const e=episode.value||1;
    url=`https://www.vidking.net/embed/tv/${currentId}/${s}/${e}`;
  } else {
    url=`https://www.vidking.net/embed/movie/${currentId}`;
  }

  player.src="about:blank";
  setTimeout(()=>player.src=url,100);
}

function closePlayer(){
  playerModal.style.display="none";
  player.src="about:blank";
}

loadTrending();
loadGenres();
renderContinue();

if(localStorage.getItem("hidePopup")!=="true"){
  popup.style.display="flex";
}

</script>

</body>
</html>
