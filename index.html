<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --hero1:#0b1020;
  --hero2:#1b0000;
  --accent:#e50914;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));
  color:white;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:24px;
  font-weight:900;
  color:var(--accent);
}

header input{
  flex:1;
  padding:12px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
}

header button{
  border:0;
  padding:12px 16px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* SETTINGS */

.settings-panel{
  position:fixed;
  top:70px;
  right:20px;
  width:220px;
  background:#111827;
  border-radius:16px;
  padding:14px;
  display:none;
  z-index:999;
}

.settings-panel h3{
  margin-top:0;
}

.settings-panel button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

/* ROWS */

.row{
  padding:10px 20px;
}

.row h2{
  margin-bottom:10px;
}

.scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

.scroll::-webkit-scrollbar{
  display:none;
}

/* CARDS */

.card{
  min-width:150px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.2s;
  background:#111;
}

.card:hover{
  transform:scale(1.07);
}

.card img{
  width:150px;
  height:225px;
  object-fit:cover;
  display:block;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.95),transparent);
  opacity:0;
  transition:.2s;
}

.card:hover .overlay{
  opacity:1;
}

/* PLAYER */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.player-box{
  width:min(1200px,95vw);
}

iframe{
  width:100%;
  height:75vh;
  border:0;
  border-radius:14px;
  background:black;
}

/* TV CONTROLS */

.tv-controls{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv-controls input{
  width:100px;
  padding:10px;
  border-radius:10px;
  border:0;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

.popup-box{
  width:320px;
  background:#111827;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.popup-box button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#333;
  color:white;
}

</style>
</head>

<body>

<!-- POPUP -->

<div class="popup" id="startupPopup">

  <div class="popup-box">

    <h2>Featured Picks</h2>

    <p>Movie: Coraline</p>

    <button
      class="primary"
      onclick="openFeatured('Coraline','movie')">
      Watch Movie
    </button>

    <p>Show: SK8 the Infinity</p>

    <button
      class="primary"
      onclick="openFeatured('SK8 the Infinity','tv')">
      Watch Show
    </button>

    <button
      class="secondary"
      onclick="dontShowAgain()">
      Don't show again
    </button>

    <button
      class="secondary"
      onclick="closePopup()">
      Close
    </button>

  </div>

</div>

<!-- SETTINGS -->

<div class="settings-panel" id="settingsPanel">

  <h3>Themes</h3>

  <button onclick="setTheme('red')">
    Netflix Red
  </button>

  <button onclick="setTheme('blue')">
    Blue
  </button>

  <button onclick="setTheme('purple')">
    Purple
  </button>

  <button onclick="setTheme('green')">
    Green
  </button>

</div>

<!-- HEADER -->

<header>

  <div class="logo">
    ENDERA'S MOVIES
  </div>

  <input
    id="searchInput"
    placeholder="Search movies & shows..."
  />

  <button onclick="search()">
    Search
  </button>

  <button onclick="toggleSettings()">
    ⚙️
  </button>

</header>

<!-- CONTINUE -->

<div class="row">

  <h2>Continue Watching</h2>

  <div class="scroll" id="continueRow"></div>

</div>

<!-- TRENDING -->

<div class="row">

  <h2>Trending Movies</h2>

  <div class="scroll" id="movies"></div>

</div>

<div class="row">

  <h2>Trending TV</h2>

  <div class="scroll" id="tv"></div>

</div>

<!-- SEARCH -->

<div class="row">

  <h2>Search Results</h2>

  <div class="scroll" id="results"></div>

</div>

<!-- PLAYER -->

<div class="modal" id="playerModal">

  <div class="player-box">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    ">

      <h2 id="title"></h2>

      <button
        onclick="closePlayer()"
        style="
          background:#e50914;
          border:0;
          color:white;
          width:42px;
          height:42px;
          border-radius:50%;
          cursor:pointer;
          font-size:18px;
          font-weight:bold;
        ">
        ✕
      </button>

    </div>

    <div
      class="tv-controls"
      id="tvControls">

      <input
        id="season"
        type="number"
        value="1"
        min="1"
      />

      <input
        id="episode"
        type="number"
        value="1"
        min="1"
      />

      <button onclick="loadPlayer()">
        Load
      </button>

    </div>

    <iframe
      id="player"
      allowfullscreen
      allow="autoplay; fullscreen">
    </iframe>

  </div>

</div>

<script>

const TMDB_KEY =
  "c926a0628b472f4bde70b9457ed62bc3";

let currentId = "";
let currentType = "movie";

/* SETTINGS */

function toggleSettings(){

  const panel =
    document.getElementById("settingsPanel");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";
}

function setTheme(theme){

  if(theme === "red"){
    document.documentElement.style.setProperty("--accent","#e50914");
    document.documentElement.style.setProperty("--hero1","#0b1020");
    document.documentElement.style.setProperty("--hero2","#1b0000");
  }

  if(theme === "blue"){
    document.documentElement.style.setProperty("--accent","#3b82f6");
    document.documentElement.style.setProperty("--hero1","#071428");
    document.documentElement.style.setProperty("--hero2","#0f3b63");
  }

  if(theme === "purple"){
    document.documentElement.style.setProperty("--accent","#a855f7");
    document.documentElement.style.setProperty("--hero1","#14051f");
    document.documentElement.style.setProperty("--hero2","#32104d");
  }

  if(theme === "green"){
    document.documentElement.style.setProperty("--accent","#22c55e");
    document.documentElement.style.setProperty("--hero1","#03140a");
    document.documentElement.style.setProperty("--hero2","#0d3d21");
  }

  localStorage.setItem("theme",theme);
}

/* POPUP */

function closePopup(){
  document.getElementById("startupPopup").style.display = "none";
}

function dontShowAgain(){

  localStorage.setItem(
    "hidePopup",
    "true"
  );

  closePopup();
}

async function openFeatured(name,type){

  const res =
    await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}`
    );

  const data =
    await res.json();

  const item =
    data.results?.[0];

  if(!item) return;

  const poster =
    `https://image.tmdb.org/t/p/w300${item.poster_path}`;

  openPlayer(
    item.id,
    type,
    name,
    poster
  );

  closePopup();
}

/* CONTINUE WATCHING */

function saveContinue(
  id,
  type,
  title,
  poster
){

  let list =
    JSON.parse(
      localStorage.getItem("cw") || "[]"
    );

  list =
    list.filter(i => i.id !== id);

  list.unshift({
    id,
    type,
    title,
    poster
  });

  localStorage.setItem(
    "cw",
    JSON.stringify(list.slice(0,10))
  );

  renderContinue();
}

function renderContinue(){

  const box =
    document.getElementById("continueRow");

  const list =
    JSON.parse(
      localStorage.getItem("cw") || "[]"
    );

  box.innerHTML = "";

  list.forEach(i=>{

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${i.type}',
          '${i.title.replace(/'/g,"\\'")}',
          '${i.poster}'
        )">

        <img src="${i.poster}">

        <div class="overlay">
          <span>${i.title}</span>
        </div>

      </div>
    `;
  });
}

/* RENDER */

function render(
  id,
  data,
  type
){

  const box =
    document.getElementById(id);

  box.innerHTML = "";

  data.forEach(i=>{

    const title =
      i.title || i.name;

    const poster =
      `https://image.tmdb.org/t/p/w300${i.poster_path}`;

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${type}',
          '${title.replace(/'/g,"\\'")}',
          '${poster}'
        )">

        <img src="${poster}">

        <div class="overlay">
          <span>${title}</span>
        </div>

      </div>
    `;
  });
}

/* TRENDING */

async function loadTrending(){

  const movies =
    await fetch(
      `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`
    ).then(r=>r.json());

  const tv =
    await fetch(
      `https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`
    ).then(r=>r.json());

  render(
    "movies",
    movies.results || [],
    "movie"
  );

  render(
    "tv",
    tv.results || [],
    "tv"
  );
}

/* SEARCH */

async function search(){

  const q =
    document.getElementById("searchInput")
    .value;

  const res =
    await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`
    );

  const data =
    await res.json();

  const filtered =
    (data.results || [])
    .filter(i =>
      i.media_type === "movie" ||
      i.media_type === "tv"
    );

  const box =
    document.getElementById("results");

  box.innerHTML = "";

  filtered.forEach(i=>{

    const title =
      i.title || i.name;

    const poster =
      `https://image.tmdb.org/t/p/w300${i.poster_path}`;

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${i.media_type}',
          '${title.replace(/'/g,"\\'")}',
          '${poster}'
        )">

        <img src="${poster}">

        <div class="overlay">
          <span>${title}</span>
        </div>

      </div>
    `;
  });
}

/* PLAYER */

function openPlayer(
  id,
  type,
  title,
  poster=""
){

  currentId = id;
  currentType =
    type === "tv"
      ? "tv"
      : "movie";

  document
    .getElementById("title")
    .textContent = title;

  document
    .getElementById("playerModal")
    .style.display = "flex";

  document
    .getElementById("tvControls")
    .style.display =
      currentType === "tv"
        ? "flex"
        : "none";

  loadPlayer();

  saveContinue(
    id,
    type,
    title,
    poster
  );
}

function loadPlayer(){

  let url = "";

  if(currentType === "tv"){

    const season =
      document.getElementById("season").value || 1;

    const episode =
      document.getElementById("episode").value || 1;

    url =
      `https://vidfast.pro/tv/${currentId}/${season}/${episode}?autoPlay=true`;

  }else{

    url =
      `https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  const iframe =
    document.getElementById("player");

  iframe.src = "about:blank";

  setTimeout(()=>{
    iframe.src = url;
  },100);
}

function closePlayer(){

  const modal =
    document.getElementById("playerModal");

  const iframe =
    document.getElementById("player");

  modal.style.display = "none";

  iframe.src = "about:blank";
}

/* INIT */

loadTrending();

renderContinue();

const savedTheme =
  localStorage.getItem("theme");

if(savedTheme){
  setTheme(savedTheme);
}

if(
  localStorage.getItem("hidePopup")
  !== "true"
){
  document
    .getElementById("startupPopup")
    .style.display = "flex";
}

</script>

</body>
</html>
