<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --bg1:#0b1020;
  --bg2:#1b0000;
  --accent:#e50914;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:white;
  overflow-x:hidden;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:999;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--accent);
}

header input{
  flex:1;
  padding:12px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
  outline:none;
}

header button{
  border:0;
  padding:12px 16px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* SETTINGS */

.settings{
  position:fixed;
  top:70px;
  right:20px;
  width:220px;
  background:#111827;
  border-radius:16px;
  padding:14px;
  display:none;
  z-index:9999;
}

.settings h3{
  margin-top:0;
}

.settings button{
  width:100%;
  margin-top:8px;
}

/* ROWS */

.row{
  padding:18px 20px;
}

.row h2{
  margin-bottom:10px;
}

.scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

.scroll::-webkit-scrollbar{
  display:none;
}

/* CARDS */

.card{
  min-width:150px;
  width:150px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.2s;
  background:#111;
}

.card:hover{
  transform:scale(1.08);
}

.card img{
  width:100%;
  height:225px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.95),transparent);
  opacity:0;
  transition:.2s;
}

.card:hover .overlay{
  opacity:1;
}

/* PLAYER */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

.player-box{
  width:min(1200px,95vw);
}

iframe{
  width:100%;
  height:75vh;
  border:0;
  border-radius:14px;
  background:black;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#e50914;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* TV CONTROLS */

.tv-controls{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv-controls input{
  width:100px;
  padding:10px;
  border-radius:10px;
  border:0;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
}

.popup-box{
  width:320px;
  background:#111827;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.popup-box button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#333;
  color:white;
}

</style>
</head>

<body>

<!-- POPUP -->

<div class="popup" id="popup">

  <div class="popup-box">

    <h2>Featured Picks</h2>

    <p>🎬 Coraline</p>

    <button
      class="primary"
      onclick="featured('Coraline','movie')">
      Watch Movie
    </button>

    <p>📺 SK8 the Infinity</p>

    <button
      class="primary"
      onclick="featured('SK8 the Infinity','tv')">
      Watch Show
    </button>

    <button
      class="secondary"
      onclick="dontShowAgain()">
      Don't show again
    </button>

    <button
      class="secondary"
      onclick="closePopup()">
      Close
    </button>

  </div>

</div>

<!-- SETTINGS -->

<div class="settings" id="settings">

  <h3>Themes</h3>

  <button onclick="theme('red')">Netflix Red</button>
  <button onclick="theme('blue')">Ocean Blue</button>
  <button onclick="theme('purple')">Purple</button>
  <button onclick="theme('green')">Green</button>

</div>

<!-- HEADER -->

<header>

  <div class="logo">
    ENDERA
  </div>

  <input
    id="searchInput"
    placeholder="Search movies & shows..."
  />

  <button onclick="searchMedia()">
    Search
  </button>

  <button onclick="toggleSettings()">
    ⚙️
  </button>

</header>

<!-- CONTINUE -->

<div class="row">
  <h2>Continue Watching</h2>
  <div class="scroll" id="continueRow"></div>
</div>

<!-- TRENDING -->

<div class="row">
  <h2>Trending Movies</h2>
  <div class="scroll" id="movies"></div>
</div>

<div class="row">
  <h2>Trending TV</h2>
  <div class="scroll" id="tv"></div>
</div>

<div class="row">
  <h2>Search Results</h2>
  <div class="scroll" id="results"></div>
</div>

<!-- PLAYER -->

<div class="modal" id="playerModal">

  <div class="player-box">

    <div class="topbar">

      <h2 id="playerTitle"></h2>

      <button
        class="close-btn"
        onclick="closePlayer()">
        ✕
      </button>

    </div>

    <div
      class="tv-controls"
      id="tvControls">

      <input
        id="season"
        type="number"
        min="1"
        value="1"
      />

      <input
        id="episode"
        type="number"
        min="1"
        value="1"
      />

      <button onclick="loadPlayer()">
        Load
      </button>

    </div>

    <iframe
      id="player"
      allowfullscreen
      allow="autoplay; fullscreen"
      sandbox="
        allow-scripts
        allow-same-origin
        allow-forms
        allow-presentation
      ">
    </iframe>

  </div>

</div>

<script>

const TMDB_KEY =
  "c926a0628b472f4bde70b9457ed62bc3";

let currentId = "";
let currentType = "movie";

/* SETTINGS */

function toggleSettings(){

  const s =
    document.getElementById("settings");

  s.style.display =
    s.style.display === "block"
      ? "none"
      : "block";
}

function theme(t){

  if(t==="red"){
    set("#0b1020","#1b0000","#e50914");
  }

  if(t==="blue"){
    set("#071428","#0f3b63","#3b82f6");
  }

  if(t==="purple"){
    set("#16051f","#35104d","#a855f7");
  }

  if(t==="green"){
    set("#04140a","#0c3b1d","#22c55e");
  }

  localStorage.setItem("theme",t);
}

function set(bg1,bg2,accent){

  document.documentElement
    .style.setProperty("--bg1",bg1);

  document.documentElement
    .style.setProperty("--bg2",bg2);

  document.documentElement
    .style.setProperty("--accent",accent);
}

/* POPUP */

function closePopup(){

  document.getElementById("popup")
    .style.display="none";
}

function dontShowAgain(){

  localStorage.setItem(
    "hidePopup",
    "true"
  );

  closePopup();
}

async function featured(name,type){

  const res =
    await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}`
    );

  const data =
    await res.json();

  const item =
    data.results?.[0];

  if(!item) return;

  openPlayer(
    item.id,
    type,
    item.title || item.name,
    `https://image.tmdb.org/t/p/w300${item.poster_path}`
  );

  closePopup();
}

/* CONTINUE WATCHING */

function saveContinue(
  id,
  type,
  title,
  poster
){

  let list =
    JSON.parse(
      localStorage.getItem("cw") || "[]"
    );

  list =
    list.filter(i=>i.id!==id);

  list.unshift({
    id,
    type,
    title,
    poster
  });

  localStorage.setItem(
    "cw",
    JSON.stringify(list.slice(0,10))
  );

  renderContinue();
}

function renderContinue(){

  const box =
    document.getElementById("continueRow");

  const list =
    JSON.parse(
      localStorage.getItem("cw") || "[]"
    );

  box.innerHTML = "";

  list.forEach(i=>{

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${i.type}',
          '${i.title.replace(/'/g,"\\'")}',
          '${i.poster}'
        )">

        <img src="${i.poster}">

        <div class="overlay">
          <span>${i.title}</span>
        </div>

      </div>
    `;
  });
}

/* RENDER */

function render(id,data,type){

  const box =
    document.getElementById(id);

  box.innerHTML = "";

  data.forEach(i=>{

    const title =
      i.title || i.name;

    const poster =
      `https://image.tmdb.org/t/p/w300${i.poster_path}`;

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${type}',
          '${title.replace(/'/g,"\\'")}',
          '${poster}'
        )">

        <img src="${poster}">

        <div class="overlay">
          <span>${title}</span>
        </div>

      </div>
    `;
  });
}

/* TRENDING */

async function loadTrending(){

  const movies =
    await fetch(
      `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`
    ).then(r=>r.json());

  const tv =
    await fetch(
      `https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`
    ).then(r=>r.json());

  render(
    "movies",
    movies.results || [],
    "movie"
  );

  render(
    "tv",
    tv.results || [],
    "tv"
  );
}

/* SEARCH */

async function searchMedia(){

  const q =
    document.getElementById("searchInput")
    .value.trim();

  if(!q) return;

  const res =
    await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`
    );

  const data =
    await res.json();

  const results =
    (data.results || [])
    .filter(i =>
      i.media_type==="movie" ||
      i.media_type==="tv"
    );

  const box =
    document.getElementById("results");

  box.innerHTML = "";

  results.forEach(i=>{

    const title =
      i.title || i.name;

    const poster =
      `https://image.tmdb.org/t/p/w300${i.poster_path}`;

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer(
          '${i.id}',
          '${i.media_type}',
          '${title.replace(/'/g,"\\'")}',
          '${poster}'
        )">

        <img src="${poster}">

        <div class="overlay">
          <span>${title}</span>
        </div>

      </div>
    `;
  });
}

/* PLAYER */

function openPlayer(
  id,
  type,
  title,
  poster=""
){

  currentId = id;

  currentType =
    type === "tv"
      ? "tv"
      : "movie";

  document.getElementById("playerTitle")
    .textContent = title;

  document.getElementById("playerModal")
    .style.display = "flex";

  document.getElementById("tvControls")
    .style.display =
      currentType === "tv"
        ? "flex"
        : "none";

  loadPlayer();

  saveContinue(
    id,
    type,
    title,
    poster
  );
}

function loadPlayer(){

  let url = "";

  if(currentType==="tv"){

    const season =
      document.getElementById("season")
      .value || 1;

    const episode =
      document.getElementById("episode")
      .value || 1;

    url =
      `https://vidfast.pro/tv/${currentId}/${season}/${episode}?autoPlay=true`;

  }else{

    url =
      `https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  const iframe =
    document.getElementById("player");

  iframe.src = "about:blank";

  setTimeout(()=>{
    iframe.src = url;
  },100);
}

function closePlayer(){

  const modal =
    document.getElementById("playerModal");

  const iframe =
    document.getElementById("player");

  modal.style.display = "none";

  iframe.src = "about:blank";
}

/* REDIRECT BLOCKER */

const iframe =
  document.getElementById("player");

window.addEventListener(
  "beforeunload",
  (e)=>{

    if(
      document.activeElement === iframe
    ){
      e.preventDefault();
      e.returnValue = "";
    }
  }
);

document.addEventListener(
  "click",
  (e)=>{

    const link =
      e.target.closest("a");

    if(!link) return;

    if(
      document.getElementById("playerModal")
        .style.display === "flex"
    ){
      e.preventDefault();
    }
  }
);

/* INIT */

loadTrending();

renderContinue();

const savedTheme =
  localStorage.getItem("theme");

if(savedTheme){
  theme(savedTheme);
}

if(
  localStorage.getItem("hidePopup")
  !== "true"
){
  document.getElementById("popup")
    .style.display="flex";
}

</script>

</body>
</html>
