<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --bg:#0b1020;
  --panel:#121a33;
  --card:#16203f;
  --text:#fff;
  --muted:#9aa8c7;
  --accent:#e50914;
  --hero1:#0b1020;
  --hero2:#1b0000;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px 18px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:900;
  color:var(--accent);
  font-size:24px;
}

header input{
  flex:1;
  padding:10px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
}

header button{
  border:0;
  padding:10px 16px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

/* GRID */
.section{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}

.card{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  background:#111;
  transition:.2s;
}

.card:hover{transform:scale(1.05);}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  opacity:0;
  transition:.2s;
}

.card:hover .overlay{opacity:1;}

.overlay h3{
  margin:0;
  font-size:14px;
}

/* PLAYER */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(1100px,95vw);
}

iframe{
  width:100%;
  height:70vh;
  border:0;
  border-radius:14px;
  background:black;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close{
  background:var(--accent);
  border:0;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.tv{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv input{
  width:120px;
  padding:10px;
  border-radius:10px;
  border:0;
}

.tv button{
  background:var(--accent);
  border:0;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <div class="logo">ENDERA'S MOVIES</div>
  <input id="searchInput" placeholder="Search movies or shows..."/>
  <button id="searchBtn">Search</button>
</header>

<div class="section">
  <div class="grid" id="results"></div>
</div>

<!-- PLAYER -->
<div class="modal" id="playerModal">

  <div class="box">

    <div class="top">
      <h2 id="playerTitle"></h2>
      <button class="close" onclick="closePlayer()">Close</button>
    </div>

    <div class="tv" id="tvControls">
      <input id="season" type="number" value="1" min="1"/>
      <input id="episode" type="number" value="1" min="1"/>
      <button onclick="loadPlayer()">Load</button>
    </div>

    <iframe
      id="player"
      allow="autoplay; fullscreen"
      allowfullscreen
      src="about:blank">
    </iframe>

  </div>
</div>

<script type="module">

const TMDB_KEY =
  "c926a0628b472f4bde70b9457ed62bc3";

let currentId = "";
let currentType = "movie";

/* SEARCH */
window.search = async ()=>{

  const q =
    document.getElementById("searchInput").value;

  const res = await fetch(
    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`
  );

  const data = await res.json();

  const box = document.getElementById("results");
  box.innerHTML = "";

  (data.results || [])
    .filter(i=>i.media_type==="movie"||i.media_type==="tv")
    .forEach(item=>{

      const title =
        item.title || item.name;

      const poster =
        item.poster_path
          ? `https://image.tmdb.org/t/p/w500${item.poster_path}`
          : "";

      const type =
        item.media_type === "tv"
          ? "series"
          : "movie";

      box.innerHTML += `
        <div class="card"
          onclick="openPlayer('${item.id}','${type}','${title.replace(/'/g,"\\'")}')">

          <img src="${poster}">
          <div class="overlay">
            <h3>${title}</h3>
          </div>

        </div>
      `;
    });
};

/* OPEN PLAYER */
window.openPlayer = async (id,type,title)=>{

  currentId = id;
  currentType = type;

  document.getElementById("playerTitle").textContent = title;

  document.getElementById("playerModal").style.display = "flex";

  document.getElementById("tvControls").style.display =
    type === "series" ? "flex" : "none";

  await loadPlayer();
};

/* FIXED PLAYER LOADING */
window.loadPlayer = ()=>{

  const iframe = document.getElementById("player");

  let url = "";

  if(currentType === "series"){

    const season = document.getElementById("season").value || 1;
    const episode = document.getElementById("episode").value || 1;

    url =
      `https://vidfast.pro/tv/${currentId}/${season}/${episode}?autoPlay=true`;

  }else{

    url =
      `https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  iframe.src = "about:blank";

  setTimeout(()=>{
    iframe.src = url;
  },120);
};

/* CLOSE */
window.closePlayer = ()=>{

  document.getElementById("playerModal").style.display = "none";
  document.getElementById("player").src = "about:blank";
};

/* ENTER */
document.getElementById("searchBtn").onclick = search;

document.getElementById("searchInput")
.addEventListener("keydown",(e)=>{
  if(e.key==="Enter") search();
});

</script>

</body>
</html>
