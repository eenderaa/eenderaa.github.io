<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --hero1:#0b1020;
  --hero2:#1b0000;
  --accent:#e50914;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px 18px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  z-index:10;
}

.logo{
  font-weight:900;
  color:var(--accent);
  font-size:22px;
}

header input{
  flex:1;
  padding:10px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
}

header button{
  border:0;
  padding:10px 14px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

/* SETTINGS BUTTON */
.settings-btn{
  background:#222;
}

/* HERO + ROWS */
.hero{
  padding:40px 20px;
}

.row{
  padding:0 20px 30px;
}

.row h2{
  margin:20px 0 10px;
}

.scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.card{
  min-width:140px;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:.2s;
}

.card:hover{transform:scale(1.08);}

.card img{
  width:140px;
  height:210px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:8px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  opacity:0;
}

.card:hover .overlay{opacity:1;}

/* PLAYER */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(1100px,95vw);
}

iframe{
  width:100%;
  height:70vh;
  border:0;
  border-radius:14px;
  background:black;
}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.close{
  background:var(--accent);
  border:0;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.tv{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv input{
  width:120px;
  padding:10px;
  border-radius:10px;
  border:0;
}

.tv button{
  background:var(--accent);
  border:0;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* SETTINGS PANEL */
.panel{
  position:fixed;
  top:70px;
  right:20px;
  width:220px;
  background:#111827;
  border-radius:14px;
  padding:14px;
  display:none;
  z-index:999;
}

.panel h3{
  margin:0 0 10px;
}

.panel button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  cursor:pointer;
}

.panel button:hover{
  background:#333;
}

</style>
</head>

<body>

<header>

  <div class="logo">ENDERA</div>

  <input id="searchInput" placeholder="Search movies & shows..."/>

  <button id="searchBtn">Search</button>

  <button class="settings-btn" id="settingsBtn">⚙️</button>

</header>

<!-- SETTINGS PANEL -->
<div class="panel" id="settingsPanel">

  <h3>Settings</h3>

  <button onclick="setTheme('netflix')">Netflix Red</button>
  <button onclick="setTheme('blue')">Blue</button>
  <button onclick="setTheme('purple')">Purple</button>
  <button onclick="setTheme('green')">Green</button>

</div>

<!-- HERO -->
<div class="hero">
  <h1>Welcome</h1>
</div>

<!-- TRENDING -->
<div class="row">
  <h2>Trending Movies</h2>
  <div class="scroll" id="trendMovies"></div>
</div>

<div class="row">
  <h2>Trending TV</h2>
  <div class="scroll" id="trendTV"></div>
</div>

<div class="row">
  <h2>Search</h2>
  <div class="scroll" id="results"></div>
</div>

<!-- PLAYER -->
<div class="modal" id="playerModal">

  <div class="box">

    <div class="top">
      <h2 id="playerTitle"></h2>
      <button class="close" onclick="closePlayer()">Close</button>
    </div>

    <div class="tv" id="tvControls">
      <input id="season" type="number" value="1"/>
      <input id="episode" type="number" value="1"/>
      <button onclick="loadPlayer()">Load</button>
    </div>

    <iframe id="player"></iframe>

  </div>

</div>

<script>

const TMDB_KEY =
  "c926a0628b472f4bde70b9457ed62bc3";

let currentId="";
let currentType="movie";

/* SETTINGS */
document.getElementById("settingsBtn")
.addEventListener("click",()=>{

  const panel =
    document.getElementById("settingsPanel");

  panel.style.display =
    panel.style.display==="block"
      ? "none"
      : "block";
});

/* THEMES */
function setTheme(t){

  if(t==="netflix"){
    document.documentElement.style.setProperty("--accent","#e50914");
    document.documentElement.style.setProperty("--hero1","#0b1020");
    document.documentElement.style.setProperty("--hero2","#1b0000");
  }

  if(t==="blue"){
    document.documentElement.style.setProperty("--accent","#3b82f6");
    document.documentElement.style.setProperty("--hero1","#071428");
    document.documentElement.style.setProperty("--hero2","#0f3b63");
  }

  if(t==="purple"){
    document.documentElement.style.setProperty("--accent","#a855f7");
    document.documentElement.style.setProperty("--hero1","#14051f");
    document.documentElement.style.setProperty("--hero2","#32104d");
  }

  if(t==="green"){
    document.documentElement.style.setProperty("--accent","#22c55e");
    document.documentElement.style.setProperty("--hero1","#03140a");
    document.documentElement.style.setProperty("--hero2","#0d3d21");
  }

  localStorage.setItem("theme",t);
}

window.addEventListener("load",()=>{
  const saved=localStorage.getItem("theme");
  if(saved) setTheme(saved);
});

/* TRENDING */
async function loadTrending(){

  const m =
    await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`)
    .then(r=>r.json());

  const tv =
    await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`)
    .then(r=>r.json());

  render("trendMovies",m.results,"movie");
  render("trendTV",tv.results,"tv");
}

function render(id,data,type){

  const box=document.getElementById(id);
  box.innerHTML="";

  data.forEach(i=>{

    const title=i.title||i.name;

    box.innerHTML+=`
      <div class="card"
        onclick="openPlayer('${i.id}','${type}','${title.replace(/'/g,"\\'")}')">

        <img src="https://image.tmdb.org/t/p/w300${i.poster_path}">
        <div class="overlay"><span>${title}</span></div>

      </div>
    `;
  });
}

/* SEARCH */
document.getElementById("searchBtn").onclick=async()=>{

  const q=document.getElementById("searchInput").value;

  const res=
    await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${q}`);

  const data=await res.json();

  const box=document.getElementById("results");
  box.innerHTML="";

  (data.results||[])
  .filter(i=>i.media_type==="movie"||i.media_type==="tv")
  .forEach(i=>{

    const title=i.title||i.name;

    box.innerHTML+=`
      <div class="card"
        onclick="openPlayer('${i.id}','${i.media_type}','${title.replace(/'/g,"\\'")}')">

        <img src="https://image.tmdb.org/t/p/w300${i.poster_path}">
        <div class="overlay"><span>${title}</span></div>

      </div>
    `;
  });
};

/* PLAYER */
function openPlayer(id,type,title){

  currentId=id;
  currentType=type==="tv"?"tv":"movie";

  document.getElementById("playerTitle").textContent=title;
  document.getElementById("playerModal").style.display="flex";

  document.getElementById("tvControls").style.display=
    type==="tv"?"flex":"none";

  loadPlayer();
}

function loadPlayer(){

  let url="";

  if(currentType==="tv"){

    const s=document.getElementById("season").value;
    const e=document.getElementById("episode").value;

    url=`https://vidfast.pro/tv/${currentId}/${s}/${e}?autoPlay=true`;

  }else{
    url=`https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  const iframe=document.getElementById("player");
  iframe.src="about:blank";

  setTimeout(()=>iframe.src=url,100);
}

function closePlayer(){
  document.getElementById("playerModal").style.display="none";
  document.getElementById("player").src="about:blank";
}

/* INIT */
loadTrending();

</script>

</body>
</html>
