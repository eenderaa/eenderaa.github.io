<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Endera's Movies</title>

<style>

:root{
  --hero1:#0b1020;
  --hero2:#1b0000;
  --accent:#e50914;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px 18px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  z-index:10;
}

.logo{
  font-weight:900;
  color:var(--accent);
  font-size:22px;
}

header input{
  flex:1;
  padding:10px;
  border-radius:999px;
  border:0;
  background:#1a1f2e;
  color:white;
}

header button{
  border:0;
  padding:10px 14px;
  border-radius:999px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

/* HERO */
.hero{
  padding:40px 20px;
}

.hero h1{
  font-size:40px;
  margin:0;
}

.hero p{
  opacity:.8;
}

/* ROWS */
.row{
  padding:0 20px 30px;
}

.row h2{
  margin:20px 0 10px;
}

.scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
}

.scroll::-webkit-scrollbar{
  display:none;
}

/* CARD */
.card{
  min-width:140px;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:.2s;
}

.card:hover{
  transform:scale(1.08);
}

.card img{
  width:140px;
  height:210px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:8px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  opacity:0;
}

.card:hover .overlay{
  opacity:1;
}

/* PLAYER */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(1100px,95vw);
}

iframe{
  width:100%;
  height:70vh;
  border:0;
  border-radius:14px;
  background:black;
}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.close{
  background:var(--accent);
  border:0;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.tv{
  display:none;
  gap:10px;
  margin-bottom:10px;
}

.tv input{
  width:120px;
  padding:10px;
  border-radius:10px;
  border:0;
}

.tv button{
  background:var(--accent);
  border:0;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <div class="logo">ENDERA'S MOVIES</div>
  <input id="searchInput" placeholder="Search movies & shows..."/>
  <button id="searchBtn">Search</button>
</header>

<!-- HOME -->
<div class="hero">
  <h1>Welcome to Endera's movies</h1>
  <p>Trending movies and TV shows</p>
</div>

<div class="row">
  <h2>Trending Movies</h2>
  <div class="scroll" id="trendMovies"></div>
</div>

<div class="row">
  <h2>Trending TV Shows</h2>
  <div class="scroll" id="trendTV"></div>
</div>

<div class="row">
  <h2>Search Results</h2>
  <div class="scroll" id="results"></div>
</div>

<!-- PLAYER -->
<div class="modal" id="playerModal">

  <div class="box">

    <div class="top">
      <h2 id="playerTitle"></h2>
      <button class="close" onclick="closePlayer()">Close</button>
    </div>

    <div class="tv" id="tvControls">
      <input id="season" type="number" value="1"/>
      <input id="episode" type="number" value="1"/>
      <button onclick="loadPlayer()">Load</button>
    </div>

    <iframe id="player" allowfullscreen></iframe>

  </div>

</div>

<script>

const TMDB_KEY =
  "c926a0628b472f4bde70b9457ed62bc3";

let currentId = "";
let currentType = "movie";

/* TRENDING HOME */

async function loadTrending(){

  const movieRes =
    await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`);

  const tvRes =
    await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`);

  const movies =
    (await movieRes.json()).results || [];

  const tv =
    (await tvRes.json()).results || [];

  renderRow("trendMovies",movies,"movie");
  renderRow("trendTV",tv,"tv");
}

function renderRow(id,data,type){

  const box =
    document.getElementById(id);

  box.innerHTML = "";

  data.forEach(item=>{

    const title =
      item.title || item.name;

    const poster =
      item.poster_path
        ? `https://image.tmdb.org/t/p/w300${item.poster_path}`
        : "";

    box.innerHTML += `
      <div class="card"
        onclick="openPlayer('${item.id}','${type}','${title.replace(/'/g,"\\'")}')">

        <img src="${poster}">

        <div class="overlay">
          <span>${title}</span>
        </div>

      </div>
    `;
  });
}

/* SEARCH */

document.getElementById("searchBtn").onclick =
async function search(){

  const q =
    document.getElementById("searchInput").value;

  const res =
    await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`
    );

  const data =
    await res.json();

  const box =
    document.getElementById("results");

  box.innerHTML = "";

  (data.results || [])
    .filter(i=>i.media_type==="movie"||i.media_type==="tv")
    .forEach(item=>{

      const title =
        item.title || item.name;

      const type =
        item.media_type === "tv"
          ? "series"
          : "movie";

      box.innerHTML += `
        <div class="card"
          onclick="openPlayer('${item.id}','${type}','${title.replace(/'/g,"\\'")}')">

          <img src="https://image.tmdb.org/t/p/w300${item.poster_path}">

          <div class="overlay">
            <span>${title}</span>
          </div>

        </div>
      `;
    });
};

/* PLAYER */

function openPlayer(id,type,title){

  currentId = id;
  currentType = type;

  document.getElementById("playerTitle").textContent = title;

  document.getElementById("playerModal").style.display = "flex";

  document.getElementById("tvControls").style.display =
    type==="tv" ? "flex" : "none";

  loadPlayer();
}

function loadPlayer(){

  const iframe =
    document.getElementById("player");

  let url = "";

  if(currentType==="tv"){

    const season =
      document.getElementById("season").value || 1;

    const episode =
      document.getElementById("episode").value || 1;

    url =
      `https://vidfast.pro/tv/${currentId}/${season}/${episode}?autoPlay=true`;

  }else{

    url =
      `https://vidfast.pro/movie/${currentId}?autoPlay=true`;
  }

  iframe.src = "about:blank";

  setTimeout(()=>{
    iframe.src = url;
  },120);
}

function closePlayer(){
  document.getElementById("playerModal").style.display="none";
  document.getElementById("player").src="about:blank";
}

/* ENTER SEARCH */
document.getElementById("searchInput")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("searchBtn").click();
});

/* INIT */
loadTrending();

</script>

</body>
</html>
